<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kérdésbank</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>

    <header>
        <h1>Kérdésbank</h1>
        <p>1300 kérdés – egy helyen</p>
    </header>

    <main>
        <section class="kereses">
            <input
                type="text"
                id="kereso"
                placeholder="Keress egy kérdést..."
            >
        </section>

        <section class="statisztika">
            <p id="darabszam">Kérdések betöltése...</p>
        </section>

        <section id="kerdeslista">
            <!-- Ide kerülnek majd a kérdések -->
        </section>
    </main>

    <footer>
        <p>Kérdésbank © 2026</p>
    </footer>

</body>
</html>
